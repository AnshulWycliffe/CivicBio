{% extends "base.html" %}
{% block title %}Collector Profile Setup | CivicBio{% endblock %}

{% block sidebar_nav %}
<a href="{{ url_for('collector.dashboard') }}" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
<a href="{{ url_for('collector.profile_setup') }}" class="nav-link active"><i class="fa-solid fa-id-badge"></i> Profile</a>
{% endblock %}

{% block breadcrumb %}Profile Setup{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="civic-card">
            <div class="card-body p-4">
                <h5 class="mb-3">Collector Profile Setup</h5>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Collector Name</label>
                        <input type="text" class="form-control bg-light" name="collector_name" required value="{{current_user.details.collector_name}}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Agency / Company Name</label>
                        <input type="text" class="form-control bg-light" name="agency_name" required value="{{current_user.details.agency_name}}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Vehicle Number</label>
                        <input type="text" class="form-control bg-light" name="vehicle_number" placeholder="CG-04-AB-1234" required value="{{current_user.details.vehicle_number}}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Vehicle Type</label>
                        <select class="form-select bg-light" name="vehicle_type" required value="{{current_user.details.vehicle_type}}">
                            <option>Closed Van</option>
                            <option>Refrigerated Vehicle</option>
                            <option>Covered Truck</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Assigned Zone / Area</label>
                        <input type="text" class="form-control bg-light" name="assigned_zone" placeholder="Central Raipur" required value="{{current_user.details.assigned_zone}}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Contact Number</label>
                        <input type="tel" class="form-control bg-light" name="contact_number" required value="{{current_user.details.contact_number}}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Authorization ID</label>
                        <input type="text" class="form-control bg-light" name="authorization_id" placeholder="COL-AUTH-2026-01" required value="{{current_user.details.authorization_id}}">
                    </div>
                    <button class="btn btn-primary w-100 py-2 fw-semibold">Save Profile</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
