<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CivicBio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #f8fafc 100%);
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .auth-header {
            text-align: center;
            padding: 2rem 2rem 1rem;
        }
        .auth-header .brand-icon {
            width: 48px;
            height: 48px;
            background: var(--primary);
            color: white;
            border-radius: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }
        .auth-body {
            padding: 1rem 2rem 2rem;
        }
        .auth-footer {
            text-align: center;
            padding: 1rem 2rem 1.5rem;
            border-top: 1px solid var(--border);
            background: var(--background);
        }
    </style>
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon">
                <i class="fa-solid fa-leaf"></i>
            </div>
            <h4 class="mb-1 fw-bold" style="color: var(--primary);">CivicBio</h4>
            <p class="text-muted small mb-0">Intelligent Waste Lifecycle Management</p>
        </div>
        <div class="auth-body">
            <h5 class="text-center mb-4">Create Account</h5>

            {% if error %}
                <div class="alert alert-danger border-0 py-2">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-medium">Email</label>
                    <input type="email" name="email" class="form-control bg-light" placeholder="you@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Password</label>
                    <input type="password" name="password" class="form-control bg-light" placeholder="••••••••" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium">Role</label>
                    <select name="role" class="form-select bg-light" required>
                        <option value="">Select Role</option>
                        <option value="civic">Admin</option>
                        <option value="facility">Facility</option>
                        <option value="collector">Collector</option>
                        <option value="disposal">Disposal</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
                    <i class="fa-solid fa-user-plus me-2"></i>Register
                </button>
            </form>
        </div>
        <div class="auth-footer">
            <small>
                Already have an account?
                <a href="{{ url_for('auth.login') }}" class="fw-semibold" style="color: var(--primary);">Sign In</a>
            </small>
        </div>
    </div>
</div>
</body>
</html>
