{% extends "base.html" %}
{% block title %}Disposal Profile Setup | CivicBio{% endblock %}

{% block sidebar_nav %}
<a href="{{ url_for('disposal.dashboard') }}" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
<a href="{{ url_for('disposal.profile_setup') }}" class="nav-link active"><i class="fa-solid fa-id-badge"></i> Profile</a>
{% endblock %}

{% block breadcrumb %}Profile Setup{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="civic-card">
            <div class="card-body p-4">
                <h5 class="mb-3">Disposal Unit Profile Setup</h5>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Disposal Unit Name</label>
                        <input type="text" class="form-control bg-light" name="unit_name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Facility Type</label>
                        <select class="form-select bg-light" name="facility_type" required>
                            <option>CBWTF</option>
                            <option>Incinerator</option>
                            <option>Autoclave Facility</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">License Number</label>
                        <input type="text" class="form-control bg-light" name="license_no" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Authorized Disposal Methods</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="methods" value="Incineration">
                            <label class="form-check-label">Incineration</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="methods" value="Autoclaving">
                            <label class="form-check-label">Autoclaving</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="methods" value="Chemical Treatment">
                            <label class="form-check-label">Chemical Treatment</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Max Capacity (kg/day)</label>
                        <input type="number" class="form-control bg-light" name="capacity_per_day" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Operating Area</label>
                        <input type="text" class="form-control bg-light" name="operating_area">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Contact Person</label>
                        <input type="text" class="form-control bg-light" name="contact_person">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Contact Number</label>
                        <input type="tel" class="form-control bg-light" name="contact_number">
                    </div>
                    <button class="btn btn-success w-100 py-2 fw-semibold">Save Profile</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
